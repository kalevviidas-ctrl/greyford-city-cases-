et:{subtitle:"Juhtum 001 · The Last Reservation / Viimane broneering",file:"Juhtumi toimik",intro:"Kell 22.06 leitakse restorani The Copper Finch omanik Owen Brooks oma kontorist surnuna. Restoran oli klientidele suletud, kuid töötajad liikusid veel majas. Esialgne surmaaja hinnang on 21.14–21.26. Uuri iga etappi, võrdle ütlusi ja pane märkmed kirja. Ükski vihje üksi ei lahenda juhtumit.",warning:"Juhtum 001 on sinu käes. Uuri kõik 15 etappi, võrdle ütlusi ja esita süüdistus alles siis, kui suudad oma valikut tõenditega põhjendada.",notes:"Uurija märkmik",notesHelp:"Pane kirja ajad, ütlused, vastuolud ja küsimused. Märkmed jäävad avatuks kuni lehe sulgemiseni; kopeeri need vajadusel eraldi.",decision:"Lõplik otsus",prompt:"Vali kahtlusalune ja põhjenda oma otsust. Püüa siduda omavahel motiiv, võimalus ja alibi.",choose:"Kes on mõrvar?",reason:"Millised tõendid toetavad sinu järeldust?",submit:"Esita lahendus",honesty:"Süüdistuse tulemus sõltub valitud kahtlusalusest. Loe enne otsust tõendid hoolikalt läbi.",correct:"Panid vangi õige inimese! Juhtum on lahendatud. Finantsdokumendid seovad Danieli kontoga 4418, tema kaart avas tagaukse surmaaja eel ning tema seletus kaardi kohta muutus.",wrong:"Panid vangi vale inimese! Tegelik süüdlane on endiselt vabaduses. Vaata uuesti üle finantsdokumentide saaja, tagaukse logi ja kahtlusaluste ütlused.",suspects:[["Daniel Reed","Restoranijuht. Owen kavatses kontrollida raamatupidamist. Daniel ütleb, et lahkus kell 21.05."],["Maya Collins","Peakokk. Kartis köögi eelarve kärpimist. Ütleb, et oli sulgemiseni köögis."],["Claire Bennett","Raamatupidaja. Owen küsis ebatavaliste arvete kohta. Ütleb, et oli kodus."],["Ethan Price","Tarnija. Vaidles Oweniga tasumata arve üle. Ütleb, et lahkus enne 21.00."],["Olivia Brooks","Oweni õde. Neil oli päranduse ja restorani tuleviku pärast tüli. Ütleb, et lahkus 20.50."]],stages:[
["Sündmuskoht","Oweni kontoris on avatud kaust märgisega “Vendor reconciliation”. Aknalukk on seest suletud. Tagumine teenindusuks viib kitsasse alleesse. Politsei kinnitab, et tegemist on tapmisega."],
["Surmaaja hinnang","Arstlik esialgne hinnang annab vahemikuks 21.14–21.26. See pole täpne kellaaeg. Iga väide, mis nimetab täpse minuti, vajab sõltumatut kinnitust."],
["Kaamera kell","Tagaukse kaamera kell on tegelikust ajast 7 minutit ees. Salvestisel siseneb tumeda jakiga inimene kell 21.19 kaamera aja järgi — tegelikult 21.12. Nägu pole selgelt näha."],
["Läbipääsulogid","Töötajakaartide logi näitab, et Danieli kaart avas tagaukse tegelikul ajal 21.12. Daniel ütleb, et hoidis kaarti kogu õhtu enda käes. Logi tõendab kaardi kasutust, mitte üksi kasutaja isikut."],
["Töötajate ütlused","Maya ütleb, et nägi Danieli köögi koridoris “umbes üheksa paiku”, kuid ei vaadanud kella. Koristaja nägi kedagi tagauksest väljumas pärast 21.20, kuid ei tundnud teda ära."],
["Esimene vastuolu","Daniel ütleb, et lahkus 21.05 ega tulnud tagasi. Tagaukse logi näitab tema kaardi kasutust 21.12. Ta väidab, et kaart võis kadunud olla, kuid ei teatanud selle kadumisest."],
["Ohvri telefon","Owen saatis Danielile 20.58 sõnumi: “Leidsin topeltarved. Räägime pärast sulgemist. Ära mine enne ära.” Daniel vastas: “Olen juba teel.” Sõnum ei tõesta iseenesest, et Daniel jäi või naasis."],
["Finantsdokumendid","Kaustas on kolm makset sama tarnija arvenumbriga, kuid erinevate summadega. Kaks neist suunati kontole, mille lõppnumbrid on 4418. Kontoomanikku pole selles dokumendis nimetatud."],
["Tarnija kontroll","Ethan kinnitab, et üks arve on tema ettevõtte oma, kuid teised kaks pole tema väljastatud. Tema ettevõtte konto lõpeb 9032, mitte 4418. Ta oli Oweniga tülis, kuid dokumendid ei seo teda topeltmaksetega."],
["Füüsiline tõend","Kontori käepidemelt leitud osaline sõrmejälg ei võimalda isikut kindlalt tuvastada. Daniel puudutas ust sageli oma töö tõttu. See tõendab kokkupuudet, mitte mõrva."],
["Alibi kontroll","Daniel esitab bensiinijaama kviitungi kellaajaga 21.31. Kassasüsteem kinnitab ostuaja. Sõit restoranist tanklasse kestab tavaliselt 8–12 minutit. Kviitung tõendab tema kohalolekut 21.31, mitte seda, kus ta oli 21.12–21.26."],
["Teine ülekuulamine","Kui Danielilt küsitakse, miks tema kaart tagaukse avas, ütleb ta, et võis selle Mayale anda. Maya eitab seda. Daniel ei maininud kaardi üleandmist esimeses ütluses. Keegi ei näinud üleandmist."],
["Tõendite ühendamine","Palgaarvestuse lisas nimetatakse konto 4418 saajaks D. Reed Consulting, Danieli loodud konsultatsioonifirma. Firma pole restoranile teenuseid osutanud. See seob Danieli võimaliku rahalise kasuga."],
["Süüdistuse koostamine","Kontrolli kolme küsimust: kes sai arvetest kasu, kellel oli võimalus olla restoranis surmaaja jooksul ja kelle seletus muutus pärast tõendite esitamist? Sõrmejälg ega motiiv üksi pole piisav."],
["Lõplik otsus","Vali kahtlusalune ja põhjenda otsust. Tugev vastus seob finantsmotiivi, võimaluse sündmuskohal olla ja alibi vastuolu. Selgita ka, miks tanklakviitung ei vabasta inimest varasema ajavahemiku osas."]
]},
en:{subtitle:"Case 001 · The Last Reservation",file:"Case file",intro:"At 10:06 p.m., Owen Brooks, owner of The Copper Finch, is found dead in his office. The restaurant is closed to customers, but staff are still inside. The preliminary time-of-death window is 9:14–9:26 p.m. Investigate each stage, compare statements, and take notes. No single clue solves the case.",warning:"Case 001 is in your hands. Investigate all 15 stages, compare statements, and submit an accusation when you can support it with evidence.",notes:"Investigator's notebook",notesHelp:"Record times, statements, contradictions, and questions. Notes remain while this page is open; copy them elsewhere if needed.",decision:"Final decision",prompt:"Choose a suspect and explain your decision. Connect motive, opportunity, and alibi.",choose:"Who is the killer?",reason:"Which evidence supports your conclusion?",submit:"Submit solution",honesty:"The result depends on the suspect you select. Review the evidence carefully before making your decision.",correct:"You put the right person behind bars! Case closed. The financial records connect Daniel to account 4418, his card opened the rear door shortly before the time of death, and his explanation about the card changed.",wrong:"You put the wrong person behind bars! The real killer is still free. Review the payment recipient, the rear-door log, and the suspects' statements.",suspects:[["Daniel Reed","Restaurant manager. Owen planned to audit the books. Daniel says he left at 9:05 p.m."],["Maya Collins","Head chef. Feared kitchen budget cuts. Says she stayed through closing."],["Claire Bennett","Accountant. Owen asked about unusual invoices. Says she was home."],["Ethan Price","Supplier. Disputed an unpaid invoice with Owen. Says he left before 9:00 p.m."],["Olivia Brooks","Owen's sister. They argued over an inheritance and the restaurant's future. Says she left at 8:50 p.m."]],stages:[
["The scene","Owen's office contains an open folder marked “Vendor reconciliation.” The window is locked from inside. The rear service door opens onto a narrow alley. Police confirm a homicide."],
["Time-of-death window","The preliminary medical estimate is 9:14–9:26 p.m. It is not an exact time. Any claim naming a precise minute needs independent confirmation."],
["Camera clock","The rear-door camera runs seven minutes ahead. It shows a person in a dark jacket entering at 9:19 by camera time — actually 9:12 p.m. The face is unclear."],
["Access log","Staff-card records show Daniel's card opened the rear door at 9:12 p.m. Daniel says he kept the card with him all evening. The log proves card use, not by itself who used it."],
["Staff statements","Maya says she saw Daniel in the kitchen corridor “around nine,” but did not check a clock. A cleaner saw someone leave through the rear door after 9:20 but could not identify them."],
["First contradiction","Daniel says he left at 9:05 and never returned. The log records his card at 9:12. He says it may have gone missing, but never reported it lost."],
["Victim's phone","At 8:58 p.m., Owen texted Daniel: “Found duplicate invoices. We talk after closing. Don't leave before then.” Daniel replied: “Already on my way.” The message alone does not prove Daniel stayed or returned."],
["Financial records","The folder contains three payments using the same supplier invoice number but different amounts. Two went to an account ending 4418. This document does not name the account holder."],
["Supplier check","Ethan confirms one invoice belongs to his company, but the other two were not issued by him. His business account ends in 9032, not 4418. The documents do not connect him to the duplicate payments."],
["Physical evidence","A partial fingerprint on the office handle does not identify anyone reliably. Daniel handled the door often for work. It proves contact, not murder."],
["Alibi check","Daniel produces a gas-station receipt timed at 9:31 p.m., confirmed by the register system. The drive usually takes 8–12 minutes. This proves he was there at 9:31, not where he was from 9:12 to 9:26."],
["Second interview","Asked why his card opened the rear door, Daniel says he may have given it to Maya. Maya denies this. Daniel did not mention a handoff in his first statement. No one witnessed one."],
["Connecting the evidence","A payroll appendix identifies the recipient of account 4418 as D. Reed Consulting, a consulting company Daniel created. The company provided no services to the restaurant. This links Daniel to a possible financial benefit."],
["Build your accusation","Check three questions: who benefited from the invoices, who could be at the restaurant during the time window, and whose account changed after evidence was presented? A fingerprint or motive alone is not enough."],
["Final decision","Choose a suspect and explain your decision. A strong answer connects financial motive, opportunity, and the alibi contradiction. Explain why the gas-station receipt does not clear someone for the earlier time window."]
]}}

$("lang").onchange=e=>{lang=e.target.value;render()};$("next").onclick=()=>{if(i<14)i++;render();if(i===14)$("decision").classList.remove("hidden")};$("prev").onclick=()=>{if(i>0)i--;render()};$("restart").onclick=()=>{i=0;$("decision").classList.add("hidden");$("result").classList.add("hidden");$("answer").value="";$("reason").value="";$("notes").value="";render();window.scrollTo({top:0,behavior:"smooth"})};$("submit").onclick=()=>{let d=D[lang];if(!$("answer").value){$("result").textContent=lang==="et"?"Vali enne süüdistuse esitamist kahtlusalune.":"Choose a suspect before submitting your accusation.";$("result").classList.remove("hidden");return}$("result").textContent=$("answer").value==="daniel"?d.correct:d.wrong;$("result").classList.remove("hidden");$("result").scrollIntoView({behavior:"smooth",block:"nearest"})};render();
</script></body></html>
